<title>NEURAL OS Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the 3D brain fills the window as the app's world; dock, status strip and glass overlays float above it. Single deliberate dark look. */
:root{
  --void:#08090a;          /* matte black ground */
  --anthracite:#131518;    /* glass base */
  --graphite:#23262b;      /* hairlines, inputs */
  --silver:#a9afb8;        /* secondary text */
  --chrome:#e7eaee;        /* primary text */
  --white:#ffffff;         /* active highlight */
  --ok:#9fc7a8; --warn:#d9c48e; --bad:#d99a8e;  /* muted semantic states */
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--void);color:var(--chrome);font-family:var(--f-ui);font-size:14px;line-height:1.5}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;transition:opacity .5s;cursor:grab;touch-action:none}
#scene.dragging{cursor:grabbing}
body.focus #scene{opacity:.18}

.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--chrome);outline-offset:2px}

/* shared glass: dark fill + gradient hairline border (light from top-left) */
.glass{background:linear-gradient(180deg,rgba(20,22,25,.78),rgba(10,11,13,.82)) padding-box,linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 35%,rgba(255,255,255,.03) 65%,rgba(255,255,255,.16)) border-box;border:1px solid transparent;backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}

/* atmosphere: vignette + viewport frame (decorative, no content) */
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 65% at 50% 46%,transparent 45%,rgba(0,0,0,.72) 100%)}
#frame{position:fixed;inset:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px));pointer-events:none}
#frame i{position:absolute;width:14px;height:14px;border-color:rgba(231,234,238,.35);border-style:solid;border-width:0}
#frame i:nth-child(1){left:0;top:0;border-left-width:1px;border-top-width:1px}
#frame i:nth-child(2){right:0;top:0;border-right-width:1px;border-top-width:1px}
#frame i:nth-child(3){left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
#frame i:nth-child(4){right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
#frame b{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:180px;height:5px;background:repeating-linear-gradient(90deg,rgba(231,234,238,.28) 0 1px,transparent 1px 10px)}

/* status bar */
#status{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:calc(22px + env(safe-area-inset-left,0px));right:calc(22px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none;font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;color:var(--silver);z-index:20}
#status .brand{display:flex;align-items:center;gap:9px;font-family:var(--f-ui);font-weight:700;letter-spacing:.32em;color:var(--white);font-size:12px;margin-right:6px}
#status .brand svg{width:20px;height:20px;stroke:var(--white);fill:none;stroke-width:1.2;filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
#status .cells{display:flex;align-items:stretch;border-radius:8px;overflow:hidden}
#status .item{display:flex;align-items:center;gap:7px;padding:6px 12px;white-space:nowrap}
#status .item+.item{border-left:1px solid rgba(231,234,238,.08)}
#status .item b{color:var(--chrome);font-weight:500}
#status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;box-shadow:0 0 2px var(--ok)}}
.demo-badge{border:1px solid rgba(217,196,142,.55);background:rgba(217,196,142,.08);color:var(--warn);padding:3px 8px;border-radius:5px;font-family:var(--f-data);font-size:9.5px;letter-spacing:.2em;font-weight:500}
#status .spacer{flex:1}
#status .view{padding:6px 12px;border-radius:8px;color:var(--chrome);letter-spacing:.18em;text-transform:uppercase;font-size:9.5px}

/* module rail */
#dock{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:7px;border-radius:14px;z-index:20}
#dock button{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:9px;color:var(--silver);transition:color .2s,background .2s}
#dock button:hover{color:var(--white);background:rgba(231,234,238,.06)}
#dock button.on{color:var(--white);background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
#dock button.on::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--white);box-shadow:0 0 10px var(--white)}
#dock button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.35}
#dock .lbl{position:absolute;left:calc(100% + 14px);top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;padding:5px 10px;border-radius:7px;background:rgba(12,13,15,.94);border:1px solid rgba(231,234,238,.14);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome);white-space:nowrap;transition:opacity .15s,transform .15s}
#dock button:hover .lbl,#dock button:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
#dock hr{border:0;height:1px;background:linear-gradient(90deg,transparent,rgba(231,234,238,.18),transparent);margin:5px 4px}

/* bottom: hints + camera controls */
#hints{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:calc(26px + env(safe-area-inset-left,0px));display:flex;gap:18px;font-family:var(--f-data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);opacity:.7;white-space:nowrap}
#hints kbd{font-family:var(--f-data);border:1px solid rgba(231,234,238,.2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:9.5px;color:var(--chrome);margin-right:4px}
#camctl{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;border-radius:10px;overflow:hidden;z-index:20}
#camctl button{padding:8px 13px;font-family:var(--f-data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver);transition:color .2s,background .2s}
#camctl button+button{border-left:1px solid rgba(231,234,238,.08)}
#camctl button:hover{color:var(--white);background:rgba(231,234,238,.06)}

/* labels & tooltip */
.rlabel{position:fixed;pointer-events:none;transform:translate(-50%,-50%);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--chrome);text-shadow:0 0 6px #000,0 0 12px #000;opacity:0;transition:opacity .4s;white-space:nowrap}
.rlabel.show{opacity:1}
.clabel{position:fixed;pointer-events:none;transform:translate(-50%,8px);font-size:11px;font-family:var(--f-data);color:var(--chrome);white-space:nowrap;text-shadow:0 0 6px #000}
.clabel.l{transform:translate(-100%,-50%);text-align:right}
.clabel.r{transform:translate(0,-50%)}
.clabel.hot{color:var(--white);text-shadow:0 0 10px rgba(255,255,255,.6),0 0 6px #000}
.btn[disabled]{opacity:.35;pointer-events:none}
.clabel i{font-style:normal;margin-left:5px}
.clabel small{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.65}
#lead{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#lead line{stroke:rgba(231,234,238,.5);stroke-width:1}
#lead .mk path{stroke:rgba(231,234,238,.6);stroke-width:1;fill:none}
#lead .ring{fill:rgba(8,9,10,.35);stroke:rgba(255,255,255,.75);stroke-width:1}
#lead .c{fill:#fff}
#lead .mk.hot line{stroke:#fff}
#lead .mk.hot .ring{stroke:#fff;stroke-width:1.4;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
.rlabel.show{pointer-events:auto;cursor:pointer}
.rlabel.hot{color:var(--white);text-shadow:0 0 10px rgba(255,255,255,.6),0 0 6px #000}
#tip{position:fixed;pointer-events:none;z-index:40;max-width:270px;padding:11px 13px;border-radius:10px;font-size:12px;color:var(--silver);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.show{opacity:1;transform:none}
#tip b{display:block;color:var(--white);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
#tip small{display:block;margin-top:8px;padding-top:7px;border-top:1px solid rgba(231,234,238,.08);color:var(--silver);opacity:.75;font-family:var(--f-data);font-size:10px}

/* overlays: glass panels with corner brackets */
.ov{position:fixed;width:min(380px,calc(100vw - 32px));max-height:min(580px,calc(100vh - 130px));display:flex;flex-direction:column;border-radius:14px;z-index:30;animation:ovin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes ovin{from{opacity:0;transform:translateY(8px) scale(.985);filter:blur(4px)}}
.ov::before,.ov::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none;border:0 solid rgba(255,255,255,.75)}
.ov::before{left:-5px;top:-5px;border-left-width:1px;border-top-width:1px}
.ov::after{right:-5px;bottom:-5px;border-right-width:1px;border-bottom-width:1px}
.ov header{position:relative;display:flex;align-items:center;gap:10px;padding:12px 12px 11px 16px;cursor:move;user-select:none}
.ov header::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 70%,transparent)}
.ov header .code{font-family:var(--f-data);font-size:9.5px;color:var(--silver);letter-spacing:.1em;padding:2px 5px;border:1px solid rgba(231,234,238,.16);border-radius:4px}
.ov header h2{margin:0;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;flex:1;color:var(--white)}
.ov header button{width:24px;height:24px;border-radius:6px;color:var(--silver);display:grid;place-items:center;font-size:14px;transition:background .15s,color .15s}
.ov header button:hover{background:rgba(231,234,238,.09);color:var(--white)}
.ov .body{padding:14px 16px 16px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(231,234,238,.18) transparent}
.ov.min .body{display:none}
.ov.front{z-index:31}
.ov:not(.front){filter:brightness(.82)}
.sec{display:flex;align-items:center;gap:10px;font-family:var(--f-data);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--silver);margin:18px 0 8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(231,234,238,.14),transparent)}
.sec:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:12px}
.kv span{padding:6px 0;border-bottom:1px solid rgba(231,234,238,.05)}
.kv span:nth-child(odd){color:var(--silver)}
.kv span:nth-child(even){font-family:var(--f-data);text-align:right;color:var(--white)}
.list{display:flex;flex-direction:column;gap:2px}
.row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12px;min-width:0;transition:background .15s}
.row:hover{background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.015))}
.row:hover::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--white)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--chrome)}
.row .m{color:var(--silver);font-family:var(--f-data);font-size:10.5px;white-space:nowrap}
.pill{font-family:var(--f-data);font-size:9.5px;letter-spacing:.06em;padding:2px 8px;border-radius:20px;border:1px solid color-mix(in srgb,currentColor 45%,transparent);background:color-mix(in srgb,currentColor 10%,transparent);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mute{color:var(--silver)}
.tag{font-family:var(--f-data);font-size:9.5px;color:var(--warn);letter-spacing:.14em}
.ev{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:8px 10px 8px 18px;border-radius:8px;font-size:12px}
.ev::before{content:"";position:absolute;left:6px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--silver);box-shadow:0 0 6px rgba(255,255,255,.4)}
.ev::after{content:"";position:absolute;left:8px;top:22px;bottom:-6px;width:1px;background:rgba(231,234,238,.1)}
.ev:last-child::after{display:none}
.ev:hover{background:rgba(231,234,238,.045)}
.ev .t{font-family:var(--f-data);font-size:10.5px;color:var(--silver)}
.ev .d{min-width:0;overflow-wrap:anywhere;color:var(--chrome)}
.ev .r{grid-column:2;font-family:var(--f-data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver);opacity:.8}
.note{font-size:13px;line-height:1.65;color:var(--chrome)}
.note h3{font-size:16px;font-weight:600;margin:0 0 8px;color:var(--white)}
.note .wl{color:var(--white);border-bottom:1px solid rgba(255,255,255,.35)}
.note .callout{border:1px solid rgba(231,234,238,.1);border-left:2px solid var(--white);border-radius:0 8px 8px 0;padding:8px 12px;margin:10px 0;background:rgba(231,234,238,.04);font-size:12px}
.btn{border:1px solid rgba(231,234,238,.18);border-radius:8px;padding:6px 12px;font-size:11px;letter-spacing:.06em;color:var(--chrome);background:rgba(231,234,238,.03);transition:all .15s}
.btn:hover{border-color:rgba(255,255,255,.55);color:var(--white);background:rgba(231,234,238,.08);box-shadow:0 0 18px rgba(255,255,255,.08)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.seg{display:inline-flex;padding:2px;border:1px solid rgba(231,234,238,.12);border-radius:8px;background:rgba(0,0,0,.3)}
.seg button{padding:4px 11px;border-radius:6px;font-size:11px;color:var(--silver);transition:all .15s}
.seg button.on{background:rgba(231,234,238,.14);color:var(--white);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:12px;border-bottom:1px solid rgba(231,234,238,.06)}
.set small{display:block;color:var(--silver);font-size:11px;margin-top:2px}
.hint{font-size:11px;color:var(--silver);margin-top:12px;opacity:.85}
.readiness{font-family:var(--f-data);font-size:10.5px;background:rgba(0,0,0,.4);border:1px solid rgba(231,234,238,.08);border-radius:8px;padding:10px;margin-top:8px;overflow-wrap:anywhere;color:var(--silver)}
.bar{height:3px;background:rgba(231,234,238,.08);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.4),var(--white));box-shadow:0 0 8px rgba(255,255,255,.5)}
/* overview tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{padding:10px 12px;border-radius:10px;border:1px solid rgba(231,234,238,.08);background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01));min-width:0}
.tile b{display:block;font-family:var(--f-data);font-size:18px;font-weight:500;color:var(--white);letter-spacing:.02em}
.tile span{display:block;font-size:10.5px;color:var(--silver);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-family:var(--f-data);font-size:11px;color:var(--silver)}
/* horizontal bars (region activity, node types) */
.hb{display:grid;grid-template-columns:104px 1fr 48px;align-items:center;gap:10px;padding:4px 2px;font-size:11.5px}
.hb .l{color:var(--chrome);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .v{font-family:var(--f-data);font-size:10.5px;color:var(--silver);text-align:right}
.hb .bar{margin:0}
/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-family:var(--f-data);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid rgba(231,234,238,.12);color:var(--silver);transition:all .15s}
.chip:hover{color:var(--white);border-color:rgba(231,234,238,.3)}
.chip.on{color:var(--white);background:rgba(231,234,238,.12);border-color:rgba(231,234,238,.35)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}
/* compact event rows */
.evc{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:10px;padding:5px 8px;border-radius:6px;font-size:11.5px;cursor:pointer}
.evc:hover{background:rgba(231,234,238,.055)}
.evc .t{font-family:var(--f-data);font-size:10px;color:var(--silver)}
.evc .d{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chrome)}
.evc .r{font-family:var(--f-data);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver);opacity:.75}
.evmin{font-family:var(--f-data);font-size:9px;letter-spacing:.2em;color:var(--silver);opacity:.6;padding:8px 8px 2px}
/* comparison */
.cmp{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:4px 8px;font-size:11.5px}
.cmp .lbl{text-align:center;color:var(--silver);font-size:10.5px}
.cmp .a,.cmp .b{display:flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:10.5px;color:var(--chrome)}
.cmp .a{justify-content:flex-end}
.cmp .a .bar,.cmp .b .bar{flex:1;margin:0}
.cmp .a .bar{transform:scaleX(-1)}
.cmp .hd{font-size:11px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .hd.a{justify-content:flex-end}
.cmpsel{display:flex;gap:6px;align-items:center;margin:8px 0}
.cmpsel select{flex:1;min-width:0;background:rgba(0,0,0,.35);color:var(--chrome);border:1px solid rgba(231,234,238,.14);border-radius:7px;padding:5px 8px;font:inherit;font-size:11.5px}
.cmpsel span{font-family:var(--f-data);font-size:10px;color:var(--silver)}
.delta{font-family:var(--f-data);font-size:10px;color:var(--ok)}
/* evolution */
.callout2{border:1px solid rgba(231,234,238,.1);border-left:2px solid var(--white);border-radius:0 8px 8px 0;padding:9px 12px;background:rgba(231,234,238,.04);font-size:12px;line-height:1.55;color:var(--chrome)}
.callout2 b{color:var(--white);font-weight:600}
.spark{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 10px;margin:4px 0 10px}
.spark svg{width:100%;height:34px;overflow:visible}
.spark svg path.ln{fill:none;stroke:var(--white);stroke-width:1.3;filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
.spark svg path.ar{fill:rgba(255,255,255,.07);stroke:none}
.spark b{font-family:var(--f-data);font-size:13px;font-weight:500;color:var(--white)}
.spark span{grid-column:1/-1;font-size:10.5px;color:var(--silver)}
.lg{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:5px 10px;padding:8px 10px;border-radius:8px;font-size:12px}
.lg:hover{background:rgba(231,234,238,.045)}
.lg .m{text-align:right;font-family:var(--f-data);font-size:10px;color:var(--silver)}
.lg .x{grid-column:1/-1;color:var(--chrome);line-height:1.45}
.typ{font-family:var(--f-data);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid rgba(231,234,238,.16);color:var(--silver);min-width:64px;text-align:center}

/* command palette */
#pal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16vh 16px 0;background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.35),rgba(0,0,0,.7));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#pal .box{position:relative;width:min(560px,100%);border-radius:16px;overflow:hidden;animation:ovin .25s cubic-bezier(.2,.8,.2,1)}
#pal input{width:100%;box-sizing:border-box;background:transparent;border:0;padding:18px 20px 16px;font:inherit;font-size:16px;color:var(--white);outline:none}
#pal input::placeholder{color:var(--silver);opacity:.6}
#pal .box::after{content:"";position:absolute;left:0;right:0;top:56px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
#pal .res{max-height:340px;overflow:auto;padding:8px}
#pal .res .row{cursor:pointer}

  cam.th+=(goal.th-cam.th)*e;cam.ph+=(goal.ph-cam.ph)*e;cam.r+=(goal.r-cam.r)*e;cam.target.lerp(goal.target,e);
  if(Math.abs(before-(cam.r+cam.th+cam.ph+cam.target.x+cam.target.y+cam.target.z))>1e-5)dirty=true;
  let changed=false;
  for(let i=0;i<act.length;i++){if(act[i]>0){act[i]=Math.max(0,act[i]-dt*.45);changed=true;}}
  if(changed){paint();dirty=true;}
  // fx paths
  let n=0;
  for(let p=paths.length-1;p>=0;p--){const P=paths[p];P.t+=dt*.9;if(P.t>1.25){paths.splice(p,1);continue;}
    for(let j=0;j<6&&n<FXN;j++){const tt=Math.min(1,Math.max(0,P.t-j*.035));const q=P.c.getPoint(tt);fxPos[n*3]=q.x;fxPos[n*3+1]=q.y;fxPos[n*3+2]=q.z;const b=(1-j/6)*(P.t>1?Math.max(0,1.25-P.t)*4:1);fxCol[n*3]=b;fxCol[n*3+1]=b;fxCol[n*3+2]=b*1.04;fxSize[n]=5-j*.5;n++;}}
  for(let k=n;k<FXN;k++){fxCol[k*3]=fxCol[k*3+1]=fxCol[k*3+2]=0;}
  if(n>0||paths.length===0){fxGeo.attributes.position.needsUpdate=true;fxGeo.attributes.aColor.needsUpdate=true;fxGeo.attributes.aSize.needsUpdate=true;}
  if(n>0)dirty=true;
  // growth: on load the cord and all nerves grow out; a newly added connector's nerve grows on its own
  for(const [u,tg] of [[growAll,growAllTarget],[growNew,growNewTarget]]){const df=tg-u.value;if(Math.abs(df)>.002){u.value=st.reduce?tg:u.value+Math.sign(df)*Math.min(Math.abs(df),Math.max(1.4,Math.abs(df)*1.2)*dt);dirty=true;}}
  // library growth: brain size and density follow the linked file count
  {const g=libGoal();if(Math.abs(g.s-libCur.s)+Math.abs(g.den-libCur.den)>.0005){const k=st.reduce?1:Math.min(1,dt*2.5);libCur.s+=(g.s-libCur.s)*k;libCur.den+=(g.den-libCur.den)*k;applyLib();paint();dirty=true;}}
  // labels still gliding to their place
  if(!st.reduce&&regLP.some(q=>q&&Math.abs(q.tx-q.x)+Math.abs(q.ty-q.y)>.5))dirty=true;
  // shift the brain left while overlays are open on the right, so it is never covered
  const wantShift=(typeof open!=="undefined"&&open.size>0&&innerWidth>700)?Math.min(220,innerWidth*.16):0;
  if(Math.abs(wantShift-shiftCur)>.5){shiftCur+=(wantShift-shiftCur)*e;if(renderer){camera.setViewOffset(innerWidth,innerHeight,shiftCur,0,innerWidth,innerHeight);}dirty=true;}
  if(hoverPending&&!drag)doHover();
  if(dirty&&renderer&&!document.hidden){applyCam();renderer.render(scene,camera);placeLabels();updView();dirty=false;}
  requestAnimationFrame(frame);
}

  else if(d<0&&CONNECTORS.length>1){const rm=CONNECTORS.pop();evoLog.unshift({ty:"connector",txt:tf("conRemoved",{x:rm.n}),d:stamp()});}
  else return;
  refreshOv("evolution");refreshOv("overview");
  hoverCon=-1;newNerve=d>0?CONNECTORS.length-1:-1;   // the new nerve grows out of the cord
  buildBody();renderCLabels();frameBody();goal.r=DEF.r;goal.target.y=DEF.ty;lastInteract=performance.now();
  if(open.has("connectors"))fill("connectors");dirty=true;
}
const open=new Map();const ovRoot=document.getElementById("overlays");let z=0,slot=0;
function openOv(m){
  if(open.has(m)){front(open.get(m));return;}
  if(open.size>=3){closeOv(open.keys().next().value);}
  const el=document.createElement("section");el.className="ov glass";el.dataset.m=m;
  const code=String(Math.max(0,DOCK.filter(d=>d!=="|").indexOf(m))+1).padStart(2,"0");
  const w=Math.min(380,innerWidth-32);const x=Math.max(16,innerWidth-w-30-(slot%3)*28),y=72+(slot%3)*28;slot++;
  el.style.left=x+"px";el.style.top=y+"px";
  el.innerHTML=`<header><span class="code">${code}</span><h2></h2><button type="button" data-c="min" aria-label="Minimize">–</button><button type="button" data-c="close" aria-label="Close">×</button></header><div class="body"></div>`;
  ovRoot.appendChild(el);open.set(m,el);fill(m);front(el);markDock();
  const hd=el.querySelector("header");
  hd.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;front(el);const ox=e.clientX-el.offsetLeft,oy=e.clientY-el.offsetTop;hd.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.left=Math.max(0,Math.min(innerWidth-80,ev.clientX-ox))+"px";el.style.top=Math.max(0,Math.min(innerHeight-40,ev.clientY-oy))+"px";};
    const up=()=>{hd.removeEventListener("pointermove",mv);hd.removeEventListener("pointerup",up);};hd.addEventListener("pointermove",mv);hd.addEventListener("pointerup",up);});
  el.addEventListener("pointerdown",()=>front(el));
  // demo only: slider position 0..100 maps logarithmically to 0..100,000 linked files
  el.addEventListener("input",e=>{if(e.target.id==="libslider")setLib(Math.pow(10,+e.target.value/20)-1);});
  el.addEventListener("change",e=>{const s=e.target.closest("select[data-cmp]");if(s){if(s.dataset.cmp==="a")cmpA=s.value;else cmpB=s.value;fill("graph");}});
  el.addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(c){if(c.dataset.c==="close")closeOv(m);else el.classList.toggle("min");return;}
    const nt=e.target.closest("[data-note]");if(nt){curNote=+nt.dataset.note;fill("memory");return;}
    const fl=e.target.closest("[data-flt]");if(fl){actFilter=fl.dataset.flt;fill("activity");return;}
    const op=e.target.closest("[data-open]");if(op){openOv(op.dataset.open);return;}
    const cm=e.target.closest("[data-cmpm]");if(cm){cmpMode=cm.dataset.cmpm;fill("graph");return;}
    const rg=e.target.closest("[data-reg]");if(rg){const r=REG.indexOf(rg.dataset.reg);if(r>=0){act[r]=1;paint();dirty=true;}return;}
    const a=e.target.closest("[data-act]");if(a&&a.dataset.act==="focus"){enterFocus();return;}
    if(a&&a.dataset.act==="showMem"){act[0]=1;paint();dirty=true;return;}
    if(a&&(a.dataset.act==="conAdd"||a.dataset.act==="conDel")){setConnectors(a.dataset.act==="conAdd"?1:-1);return;}
    const L=e.target.closest("[data-lang]");if(L){setLang(L.dataset.lang);return;}
    const g=e.target.closest("[data-tog]");if(g){st[g.dataset.tog]=g.dataset.v==="1";if(g.dataset.tog==="privacy"){privMap.clear();refreshAll();}fill("settings");dirty=true;}});
}

const pal=document.getElementById("pal"),pin=document.getElementById("pal-in"),pres=document.getElementById("pal-res");let pItems=[],pSel=0;
function palItems(){const mods=Object.keys(MODT).map(m=>({label:t(MODT[m]),kind:"module",run:()=>openOv(m)}));
  const notes=FILES.map((F,i)=>({label:nm(F.n,"f"),kind:"note",run:()=>{curNote=i;openOv("memory");fill("memory");}}));
  const acts=[{label:t("reset"),kind:"action",run:resetView},{label:t("focusMode"),kind:"action",run:enterFocus},{label:t("privacy"),kind:"action",run:()=>{st.privacy=!st.privacy;privMap.clear();refreshAll();}},{label:lang==="de"?"Language: English":"Sprache: Deutsch",kind:"action",run:()=>setLang(lang==="de"?"en":"de")}];
  return mods.concat(notes,acts);}
function renderPal(){const q=pin.value.toLowerCase();pItems=palItems().filter(x=>x.label.toLowerCase().includes(q)).slice(0,12);pSel=Math.min(pSel,Math.max(0,pItems.length-1));
  pres.innerHTML=pItems.map((x,i)=>`<div class="row${i===pSel?" sel":""}" data-i="${i}"><span class="n">${esc(x.label)}</span><span class="m">${x.kind}</span></div>`).join("");}
function openPal(){pal.hidden=false;pin.placeholder=t("palPh");pin.value="";pSel=0;renderPal();pin.focus();}
function closePal(){pal.hidden=true;}
pin.addEventListener("input",()=>{pSel=0;renderPal();});
pin.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){pSel=Math.min(pItems.length-1,pSel+1);renderPal();e.preventDefault();}else if(e.key==="ArrowUp"){pSel=Math.max(0,pSel-1);renderPal();e.preventDefault();}else if(e.key==="Enter"){const it=pItems[pSel];closePal();if(it)it.run();}});
pres.addEventListener("click",e=>{const r=e.target.closest("[data-i]");if(!r)return;const it=pItems[+r.dataset.i];closePal();if(it)it.run();});
pal.addEventListener("click",e=>{if(e.target===pal)closePal();});

/* ---------- keys ---------- */
addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal.hidden?openPal():closePal();return;}
  if(e.key==="Escape"){if(!pal.hidden)closePal();else if(!focusEl.hidden)exitFocus();return;}
  if(typing)return;
  const k=e.key;
  if(k==="r"||k==="R"){resetView();}
  else if(k==="l"||k==="L"){showAll=!showAll;paint();}
  else if(k==="ArrowLeft"){goal.th+=.15;}else if(k==="ArrowRight"){goal.th-=.15;}
  else if(k==="ArrowUp"){goal.ph=Math.max(.15,goal.ph-.12);}else if(k==="ArrowDown"){goal.ph=Math.min(3,goal.ph+.12);}
  else if(k==="+"||k==="="){goal.r=Math.max(.12,goal.r*.85);}else if(k==="-"){goal.r=Math.min(9,goal.r/.85);}
  else return;
  lastInteract=performance.now();dirty=true;
});
document.getElementById("b-reset").addEventListener("click",resetView);
document.getElementById("b-labels").addEventListener("click",()=>{showAll=!showAll;paint();dirty=true;});

  updView();renderDock();
}
