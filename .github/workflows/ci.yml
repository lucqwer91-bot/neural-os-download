name: CI
# Every push and pull request: tests on Linux, Windows and macOS (free for public repositories).
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Electron smoke test (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test --trace off
      - name: Electron smoke test
        if: runner.os != 'Linux'
        run: npx playwright test --trace off
      - name: Keep test results of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results
          retention-days: 7
