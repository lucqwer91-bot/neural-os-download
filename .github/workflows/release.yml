name: Release
# Public, reproducible installers: every tag v* builds Windows and macOS from exactly this code,
# runs the tests, records a GitHub build-provenance attestation for each file and puts them into a
# DRAFT release with SHA-256 checksums. A maintainer reviews the draft and clicks Publish.
# Check a download: gh attestation verify <file> --repo lucqwer91-bot/neural-os-download
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            files: dist/*.exe
          - os: macos-latest
            cmd: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.files }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 30
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Built by GitHub Actions from commit ${GITHUB_SHA} of this repository (see the Actions tab)."
            echo
            echo "**SHA-256**"
            echo '```'
            cat files/SHA256SUMS.txt
            echo '```'
            echo
            echo "Check a file: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
            echo
            echo "Not code-signed yet: Windows \"More info → Run anyway\", macOS right-click → Open."
          } > notes.md
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --draft --title "NEURAL OS ${TAG#v}" --notes-file notes.md
