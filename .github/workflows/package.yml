name: Package
# Builds the installers, only on demand (Actions → Package → Run workflow), to save Actions minutes.
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            files: dist/*.exe
          - os: macos-latest
            cmd: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: neural-os-${{ matrix.os }}
          path: ${{ matrix.files }}
          retention-days: 14
